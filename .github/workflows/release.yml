name: release

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@v3
      - run: msbuild HyperionScreenCap.sln -t:Restore -p:RestorePackagesConfig=true -v:m
      - run: msbuild HyperionScreenCap.sln -p:Configuration=Release -v:m
      - id: tag
        if: github.event_name == 'push'
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          initial_version: 2.9.0
      - if: steps.tag.outputs.new_tag
        run: gh release create $env:TAG HyperionScreenCap/bin/Release/HyperionScreenCap.exe --title $env:TAG --notes $env:NOTES
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.new_tag }}
          NOTES: ${{ steps.tag.outputs.changelog }}
